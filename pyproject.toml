[project]
name = "dbf_light"
dynamic = ["version"]
description = "Light and easy DBF reader"
authors = [
    { name = "Igor Starikov", email = "idlesign@yandex.ru" },
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["dbf", "xbase", "reader"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
]

[project.urls]
Homepage = "https://github.com/idlesign/dbf_light"

[project.scripts]
dbf_light = "dbf_light.cli:main"

[project.optional-dependencies]
cli = [
    "click",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "linters" },
    { include-group = "tests" },
]
docs = [
    "mkdocs-apidescribed-plugin",
    "mkdocs-material",
    "mkdocs-navsorted-plugin",
]
linters = [
    "ruff==0.13.1",
]
tests = [
    "coverage",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dbf_light/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dbf_light"]

[tool.hatch.build.targets.sdist]
packages = ["src/"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = [
    "src/dbf_light",
]

[tool.makeapp.tests]
deps = []
